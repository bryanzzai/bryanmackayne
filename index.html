<!doctype html>
<html lang="la">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bryan MacKayne</title>
<style>
:root{--gold:#d4ad55;--gold2:#f1d788;--cream:#f4e7c7;--iron:#292b2c;--iron2:#111313;--brass:#a77a2c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:var(--cream)}
body{font-family:Georgia,'Times New Roman',serif;background:radial-gradient(circle at 50% 15%,#39342a 0,#14110d 36%,#040404 80%);overflow-x:hidden}
.page{min-height:100vh;position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.05) 37%,rgba(0,0,0,.46) 68%,rgba(0,0,0,.90) 100%),url('assets/bulgarian-ballerina.png') center 28%/cover no-repeat fixed}
.page:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 48% 34%,transparent 31%,rgba(0,0,0,.20) 65%,rgba(0,0,0,.68) 100%)}
.mast{position:relative;z-index:2;text-align:center;padding:clamp(30px,5vw,76px) 18px 12px;text-shadow:0 3px 10px #000,0 0 28px #000}
.brand{font-size:clamp(.78rem,1.4vw,1.05rem);letter-spacing:.38em;text-transform:uppercase;color:#c8b184;margin-bottom:14px}
h1{margin:0 auto;max-width:1200px;font-weight:500;line-height:.96;font-size:clamp(2.25rem,6vw,6rem);letter-spacing:.035em;text-transform:uppercase;background:linear-gradient(180deg,#fff0b3 0%,#ddb659 42%,#9b6b1b 76%,#f0ce76 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #4e3210) drop-shadow(0 7px 13px #000)}
.ornament{width:min(600px,70vw);height:1px;margin:24px auto 0;background:linear-gradient(90deg,transparent,#a77a2c 18%,#ffe19a 50%,#a77a2c 82%,transparent);position:relative}.ornament:after{content:'◆';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#e4bd66;background:#17110a;padding:0 12px;font-size:.75rem}
.spacer{flex:1;min-height:clamp(330px,48vh,680px)}
.consoleDock{position:relative;z-index:3;width:100%;display:flex;justify-content:flex-end;padding:clamp(280px,30vh,320px) clamp(18px,4vw,62px) 34px}
.console{width:min(650px,92vw);position:relative;padding:24px 24px 29px;border:3px solid #070808;border-radius:18px;background:linear-gradient(145deg,#4b4d4c 0%,#262827 18%,#111313 58%,#303231 100%);box-shadow:0 28px 60px #000d,inset 0 2px 0 #9d9d9355,inset 0 -3px 0 #000,inset 0 0 0 7px #161817}
.console:before,.console:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#aaa 0 8%,#555 20%,#151515 68%,#050505 100%);box-shadow:0 1px 2px #000}
.console:before{left:10px;top:10px}.console:after{right:10px;bottom:10px}
.consoleHead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:1px 6px 20px;padding:10px 14px;border:1px solid #070707;border-radius:7px;background:linear-gradient(180deg,#181a19,#0b0c0c);box-shadow:inset 0 1px 0 #ffffff18,0 3px 5px #0008;font:700 .68rem/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#c9b17b}
.consoleHead .bulg{color:#83775e;letter-spacing:.13em;font-size:.59rem}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 20px}
.album{position:relative;display:block;min-width:0;text-decoration:none;color:inherit;border:0;background:none;padding:0;outline:none;cursor:default}
.buttonHousing{position:relative;padding:9px 9px 17px;border-radius:14px;background:linear-gradient(145deg,#080909,#333534 18%,#0a0b0b 54%,#4a4b47 100%);border:2px solid #050505;box-shadow:inset 0 2px 2px #b4b4aa40,inset 0 -5px 9px #000,0 5px 7px #000b}
.buttonShaft{position:relative;height:132px;border-radius:10px;background:linear-gradient(90deg,#4f4635 0%,#a7894f 8%,#453820 18%,#b29559 51%,#3f321c 84%,#786038 100%);box-shadow:0 13px 0 #2a2113,0 18px 15px #000c,inset 0 2px 1px #ffe5a55c;transition:transform .075s ease,box-shadow .075s ease}
.buttonCap{position:absolute;inset:5px 5px 3px;border-radius:7px;overflow:hidden;background:#0b0c0c;border:2px solid #17120a;box-shadow:inset 0 0 0 2px #c6a15a,inset 0 8px 16px #ffffff15,inset 0 -12px 20px #000b}
.buttonCap img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(.88) contrast(1.05) brightness(.82);transform:scale(1.01)}
.buttonCap:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff24 0%,transparent 18%,transparent 66%,#000b 100%);pointer-events:none}
.firstThumb{position:absolute;inset:0;background:url('assets/Bryan MacKayne Stage.png') center 48%/cover no-repeat}.firstPortrait{position:absolute!important;left:0;top:0;width:46%!important;height:100%!important;object-fit:cover!important;object-position:center top!important;mask-image:linear-gradient(90deg,#000 62%,transparent);filter:saturate(.8) brightness(.75)!important}
.secondThumb{position:absolute;inset:0;background:url('dies-solis/assets/Sofia-1930s-banner.png') center 48%/cover no-repeat}.secondPortrait{position:absolute!important;left:0;top:0;width:46%!important;height:100%!important;object-fit:cover!important;object-position:center top!important;mask-image:linear-gradient(90deg,#000 62%,transparent);filter:saturate(.8) brightness(.75)!important}
.numberPlate{position:absolute;left:8px;top:8px;z-index:3;min-width:29px;padding:3px 6px;border:1px solid #c7aa6f77;border-radius:3px;background:#080807da;color:#ecd699;font:700 .62rem ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;text-align:center;box-shadow:0 2px 4px #0008}
.namePlate{margin:15px 4px 0;padding:8px 4px 7px;border:1px solid #70572d;border-radius:4px;background:linear-gradient(180deg,#2c2418,#0d0b08);color:#f0dca7;text-align:center;font:800 clamp(.61rem,1.2vw,.78rem)/1.05 ui-sans-serif,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;box-shadow:inset 0 1px 0 #f2d58b2b,0 2px 3px #000}
.album.future .buttonCap img{filter:saturate(.68) contrast(1.04) brightness(.70)}
.album.future:after{content:'INOP';position:absolute;right:13px;top:13px;z-index:4;padding:2px 5px;border:1px solid #7c6c4c70;border-radius:3px;background:#080807db;color:#9e8e68;font:700 .50rem ui-sans-serif,system-ui,sans-serif;letter-spacing:.11em}
.album.live{cursor:pointer}.album.live:hover .buttonCap img{filter:saturate(1) contrast(1.05) brightness(.96)}.album.live:hover .buttonShaft{box-shadow:0 14px 0 #2a2113,0 20px 18px #000d,inset 0 2px 1px #ffe5a57a}
.album.live:active .buttonShaft,.album.live.pressed .buttonShaft{transform:translateY(11px);box-shadow:0 2px 0 #2a2113,0 5px 7px #000c,inset 0 6px 15px #0009}.album.live:active .buttonCap,.album.live.pressed .buttonCap{box-shadow:inset 0 0 0 2px #8c6d38,inset 0 12px 24px #000b}
.album.live:focus-visible .buttonHousing{outline:2px solid #ffe39a;outline-offset:5px}
.foot{position:relative;z-index:2;text-align:right;padding:0 clamp(18px,4vw,62px) 30px;color:#81745b;font:500 .69rem ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase}
@media(max-width:820px){.page{background-attachment:scroll}.spacer{min-height:43vh}.consoleDock{padding-right:14px}.console{width:min(620px,96vw)}.buttonShaft{height:118px}}
@media(max-width:560px){h1{font-size:clamp(2rem,11vw,3.5rem)}.consoleDock{padding:0 8px 20px}.console{width:100%;padding:18px 14px 23px}.grid{gap:16px 11px}.buttonHousing{padding:6px 6px 13px}.buttonShaft{height:91px;box-shadow:0 9px 0 #2a2113,0 13px 11px #000c}.namePlate{margin-top:11px;font-size:.54rem;letter-spacing:.06em;padding:6px 2px}.consoleHead{margin-bottom:16px}.consoleHead .bulg{display:none}.spacer{min-height:39vh}.numberPlate{left:5px;top:5px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="page">
<header class="mast">
  <div class="brand">Bryan MacKayne</div>
  <h1>Solus stultus mare non timet</h1>
  <div class="ornament" aria-hidden="true"></div>
</header>
<div class="spacer" aria-hidden="true"></div>
<div class="consoleDock">
<section class="console" aria-label="Album selector">
  <div class="consoleHead"><span>Selectio · XII Album</span><span class="bulg">МЕХАНИЧЕН ПУЛТ · РЪЧНО УПРАВЛЕНИЕ</span></div>
  <div class="grid">
    <a class="album live" href="dies-iovis/" aria-label="Open Dies Iovis"><div class="buttonHousing"><div class="buttonShaft"><div class="buttonCap"><div class="firstThumb"></div><img class="firstPortrait" src="assets/Bryan as Kevin Kostner.png" alt=""></div><span class="numberPlate">I</span></div><div class="namePlate">Dies Iovis</div></div></a>
    <a class="album live" href="dies-solis/" aria-label="Open Dies Solis"><div class="buttonHousing"><div class="buttonShaft"><div class="buttonCap"><div class="secondThumb"></div><img class="secondPortrait" src="dies-solis/assets/Bryan-MacKayne-Centralna-Komisoya-Sofia-1930s.png" alt=""></div><span class="numberPlate">II</span></div><div class="namePlate">Dies Solis</div></div></a>
    <div class="album future"><div class="buttonHousing"><div class="buttonShaft"><div class="buttonCap"><img src="assets/comical-alien.png" alt=""></div><span class="numberPlate">III</span></div><div class="namePlate">Album III</div></div></div>
    <div class="album future"><div class="buttonHousing"><div class="buttonShaft"><div class="buttonCap"><img src="assets/comical-alien.png" alt=""></div><span class="numberPlate">IV</span></div><div class="namePlate">Album IV</div></div></div>
    <div class="album future"><div class="buttonHousing"><div class="buttonShaft"><div class="buttonCap"><img src="assets/comical-alien.png" alt=""></div><span class="numberPlate">V</span></div><div class="namePlate">Album V</div></div></div>
    <div class="album future"><div class="buttonHousing"><div class="buttonShaft"><div class="buttonCap"><img src="assets/comical-alien.png" alt=""></div><span class="numberPlate">VI</span></div><div class="namePlate">Album VI</div></div></div>
    <div class="album future"><div class="buttonHousing"><div class="buttonShaft"><div class="buttonCap"><img src="assets/comical-alien.png" alt=""></div><span class="numberPlate">VII</span></div><div class="namePlate">Album VII</div></div></div>
    <div class="album future"><div class="buttonHousing"><div class="buttonShaft"><div class="buttonCap"><img src="assets/comical-alien.png" alt=""></div><span class="numberPlate">VIII</span></div><div class="namePlate">Album VIII</div></div></div>
    <div class="album future"><div class="buttonHousing"><div class="buttonShaft"><div class="buttonCap"><img src="assets/comical-alien.png" alt=""></div><span class="numberPlate">IX</span></div><div class="namePlate">Album IX</div></div></div>
    <div class="album future"><div class="buttonHousing"><div class="buttonShaft"><div class="buttonCap"><img src="assets/comical-alien.png" alt=""></div><span class="numberPlate">X</span></div><div class="namePlate">Album X</div></div></div>
    <div class="album future"><div class="buttonHousing"><div class="buttonShaft"><div class="buttonCap"><img src="assets/comical-alien.png" alt=""></div><span class="numberPlate">XI</span></div><div class="namePlate">Album XI</div></div></div>
    <div class="album future"><div class="buttonHousing"><div class="buttonShaft"><div class="buttonCap"><img src="assets/comical-alien.png" alt=""></div><span class="numberPlate">XII</span></div><div class="namePlate">Album XII</div></div></div>
  </div>
</section>
</div>
<div class="foot">Bryan MacKayne · Musica et imagines</div>
</main>
<script>
document.querySelectorAll('.album.live').forEach(live=>{
  live.addEventListener('click',e=>{e.preventDefault();live.classList.add('pressed');setTimeout(()=>location.href=live.href,155)});
});
</script>
</body>
</html>
