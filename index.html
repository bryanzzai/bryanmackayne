<!doctype html>
<html lang="la">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bryan MacKayne</title>
<style>
:root{--gold:#d4ad55;--gold2:#f1d788;--ink:#070707;--cream:#f4e7c7;--steel:#25272c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:var(--cream)}body{font-family:Georgia,'Times New Roman',serif;background:radial-gradient(circle at 50% 15%,#39342a 0,#14110d 36%,#040404 80%);overflow-x:hidden}
.page{min-height:100vh;position:relative;display:flex;flex-direction:column;background:
linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,.08) 36%,rgba(0,0,0,.58) 69%,rgba(0,0,0,.93) 100%),
url('assets/bulgarian-ballerina.png') center 28%/cover no-repeat fixed}
.page:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 34%,rgba(0,0,0,.28) 70%,rgba(0,0,0,.72) 100%)}
.mast{position:relative;z-index:2;text-align:center;padding:clamp(30px,5vw,76px) 18px 12px;text-shadow:0 3px 10px #000,0 0 28px #000}
.brand{font-size:clamp(.78rem,1.4vw,1.05rem);letter-spacing:.38em;text-transform:uppercase;color:#c8b184;margin-bottom:14px}
h1{margin:0 auto;max-width:1200px;font-weight:500;line-height:.96;font-size:clamp(2.25rem,6vw,6rem);letter-spacing:.035em;color:var(--gold2);text-transform:uppercase;background:linear-gradient(180deg,#fff0b3 0%,#ddb659 42%,#9b6b1b 76%,#f0ce76 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #4e3210) drop-shadow(0 7px 13px #000)}
.ornament{width:min(600px,70vw);height:1px;margin:24px auto 0;background:linear-gradient(90deg,transparent,#a77a2c 18%,#ffe19a 50%,#a77a2c 82%,transparent);position:relative}.ornament:after{content:'◆';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#e4bd66;background:#17110a;padding:0 12px;font-size:.75rem}
.spacer{flex:1;min-height:clamp(280px,44vh,640px)}
.selectorWrap{position:relative;z-index:3;width:min(1180px,calc(100% - 30px));margin:0 auto 28px;padding:clamp(18px,3vw,34px);border:1px solid #624b27;border-radius:28px 28px 16px 16px;background:linear-gradient(180deg,rgba(26,20,13,.82),rgba(5,5,5,.94));box-shadow:0 -22px 65px #000a,inset 0 1px 0 #f0c96f33,inset 0 0 60px #0007;backdrop-filter:blur(8px)}
.selectorTitle{text-align:center;font:600 .72rem/1.2 ui-sans-serif,system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#bba071;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,2vw,22px)}
.album{position:relative;display:block;aspect-ratio:1.65/1;border:0;border-radius:12px;padding:0;text-decoration:none;color:var(--cream);background:#16130e;cursor:default;perspective:500px;outline:none}
.album .bezel{position:absolute;inset:0;border-radius:12px;padding:7px;background:linear-gradient(145deg,#f4d47c 0%,#846025 12%,#302411 28%,#c49a46 49%,#3d2e17 69%,#e1bc69 88%,#67491e 100%);box-shadow:0 7px 0 #1f160b,0 12px 20px #000b,inset 0 1px 1px #fff5b077;transition:transform .085s ease,box-shadow .085s ease}
.album .well{position:relative;width:100%;height:100%;overflow:hidden;border-radius:7px;border:2px solid #16100a;background:#151515;box-shadow:inset 0 0 0 2px #80612e,inset 0 10px 22px #000b}
.album .art{position:absolute;inset:0;background-position:center;background-size:cover;filter:saturate(.82) contrast(1.04) brightness(.82);transform:scale(1.01);transition:filter .15s ease,transform .15s ease}
.album .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.86) 100%)}
.album .label{position:absolute;left:9px;right:9px;bottom:8px;text-align:center;padding:7px 8px 6px;border-top:1px solid #d7b56188;background:linear-gradient(180deg,#130f09bb,#080706e8);color:#f4dfaa;font:700 clamp(.68rem,1.15vw,.9rem)/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;text-shadow:0 1px 2px #000}
.album .slot{position:absolute;top:9px;left:10px;min-width:28px;padding:3px 6px;border:1px solid #d7b56188;border-radius:3px;background:#090806c9;color:#d7bd7c;font:600 .63rem ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;text-align:center}
.album.live{cursor:pointer}.album.live .art{background-image:linear-gradient(90deg,rgba(0,0,0,.2),transparent),url('assets/Bryan MacKayne Stage.png')}.album.live .portraitMini{position:absolute;height:100%;width:42%;left:0;top:0;object-fit:cover;object-position:center top;mask-image:linear-gradient(90deg,#000 58%,transparent);filter:saturate(.8) brightness(.72)}
.album.future .art{background-image:url('assets/comical-alien.png')}.album.future:after{content:'LOCKED';position:absolute;right:11px;top:10px;padding:3px 6px;border-radius:3px;border:1px solid #79674480;color:#aa9870;background:#0b0907c9;font:600 .54rem ui-sans-serif,system-ui,sans-serif;letter-spacing:.12em}
.album.live:hover .bezel{box-shadow:0 8px 0 #1c1308,0 15px 24px #000c,inset 0 1px 1px #fff5b099}.album.live:hover .art{filter:saturate(1) contrast(1.04) brightness(.96);transform:scale(1.035)}
.album.live:active .bezel,.album.live.pressed .bezel{transform:translateY(7px) scale(.985);box-shadow:0 1px 0 #1f160b,0 4px 8px #000b,inset 0 4px 14px #0009}.album.live:active .well{box-shadow:inset 0 0 0 2px #80612e,inset 0 14px 26px #000e}.album.live:focus-visible .bezel{outline:2px solid #ffe39a;outline-offset:5px}
.foot{position:relative;z-index:2;text-align:center;padding:0 18px 28px;color:#7f725c;font:500 .72rem ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase}
@media(max-width:820px){.page{background-attachment:scroll}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.spacer{min-height:42vh}}
@media(max-width:590px){h1{font-size:clamp(2rem,11vw,3.5rem)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.selectorWrap{width:calc(100% - 16px);padding:14px;gap:10px}.album .label{font-size:.64rem;letter-spacing:.08em}.spacer{min-height:40vh}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="page">
<header class="mast">
  <div class="brand">Bryan MacKayne</div>
  <h1>Solus stultus mare non timet</h1>
  <div class="ornament" aria-hidden="true"></div>
</header>
<div class="spacer" aria-hidden="true"></div>
<section class="selectorWrap" aria-label="Album selector">
  <div class="selectorTitle">Selectio · XII Album</div>
  <div class="grid">
    <a class="album live" href="dies-iovis/" aria-label="Open Dies Iovis">
      <span class="bezel"><span class="well"><span class="art"></span><img class="portraitMini" src="assets/Bryan as Kevin Kostner.png" alt=""><span class="shade"></span><span class="slot">I</span><span class="label">Dies Iovis</span></span></span>
    </a>
    <div class="album future"><span class="bezel"><span class="well"><span class="art"></span><span class="shade"></span><span class="slot">II</span><span class="label">Dies Solis</span></span></span></div>
    <div class="album future"><span class="bezel"><span class="well"><span class="art"></span><span class="shade"></span><span class="slot">III</span><span class="label">Album III</span></span></span></div>
    <div class="album future"><span class="bezel"><span class="well"><span class="art"></span><span class="shade"></span><span class="slot">IV</span><span class="label">Album IV</span></span></span></div>
    <div class="album future"><span class="bezel"><span class="well"><span class="art"></span><span class="shade"></span><span class="slot">V</span><span class="label">Album V</span></span></span></div>
    <div class="album future"><span class="bezel"><span class="well"><span class="art"></span><span class="shade"></span><span class="slot">VI</span><span class="label">Album VI</span></span></span></div>
    <div class="album future"><span class="bezel"><span class="well"><span class="art"></span><span class="shade"></span><span class="slot">VII</span><span class="label">Album VII</span></span></span></div>
    <div class="album future"><span class="bezel"><span class="well"><span class="art"></span><span class="shade"></span><span class="slot">VIII</span><span class="label">Album VIII</span></span></span></div>
    <div class="album future"><span class="bezel"><span class="well"><span class="art"></span><span class="shade"></span><span class="slot">IX</span><span class="label">Album IX</span></span></span></div>
    <div class="album future"><span class="bezel"><span class="well"><span class="art"></span><span class="shade"></span><span class="slot">X</span><span class="label">Album X</span></span></span></div>
    <div class="album future"><span class="bezel"><span class="well"><span class="art"></span><span class="shade"></span><span class="slot">XI</span><span class="label">Album XI</span></span></span></div>
    <div class="album future"><span class="bezel"><span class="well"><span class="art"></span><span class="shade"></span><span class="slot">XII</span><span class="label">Album XII</span></span></span></div>
  </div>
</section>
<div class="foot">Bryan MacKayne · Musica et imagines</div>
</main>
<script>
const live=document.querySelector('.album.live');
live.addEventListener('click',e=>{e.preventDefault();live.classList.add('pressed');setTimeout(()=>location.href=live.href,135)});
</script>
</body>
</html>
