<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bryan MacKayne – Dies Iovis</title>
<style>
:root{--bg:#07090d;--panel:#0d1118;--panel2:#121826;--text:#f3efe4;--muted:#9ca6b5;--line:#273244;--accent:#c9b17b;--accent2:#7fa8d9;--danger:#e37d7d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 20% -10%,#1a2233 0,#0b0f16 38%,var(--bg) 72%);color:var(--text);font:16px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
button,input{font:inherit}.shell{width:min(1180px,calc(100% - 28px));margin:auto}.hero{position:relative;min-height:390px;border:1px solid #202938;border-radius:0 0 28px 28px;overflow:hidden;background:#0d1118 url('assets/Bryan MacKayne Stage.png') center 48%/cover no-repeat;box-shadow:0 30px 80px #0009}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#05070b 0%,#05070bdb 23%,#05070b55 52%,#05070b88 100%),linear-gradient(0deg,#07090df2 0%,transparent 55%)}.portrait{position:absolute;left:0;bottom:0;height:100%;width:min(420px,42vw);object-fit:cover;object-position:center top;filter:saturate(.88) contrast(1.04);mask-image:linear-gradient(90deg,#000 68%,transparent 100%);z-index:1}.heroCopy{position:absolute;left:clamp(26px,36vw,430px);bottom:42px;right:34px;z-index:2}.eyebrow{letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-size:.78rem}.hero h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(2.6rem,7vw,6.6rem);line-height:.88;margin:.18em 0 .12em;font-weight:500;text-shadow:0 5px 25px #000}.hero h1 span{display:block;color:#d8dde7;font-size:.54em;letter-spacing:.03em}.hero p{max-width:620px;color:#c9d0da;margin:.6rem 0 0}
.player{margin:26px auto 0;display:grid;grid-template-columns:1fr;gap:18px}.now{background:linear-gradient(180deg,#121824,#0b0f16);border:1px solid #202a3a;border-radius:24px;padding:22px;box-shadow:0 18px 55px #0006}.meta{display:flex;gap:16px;align-items:end;justify-content:space-between}.titleWrap small{display:block;color:var(--accent);text-transform:uppercase;letter-spacing:.17em;margin-bottom:4px}.trackTitle{font:500 clamp(1.45rem,3vw,2.3rem)/1.1 Georgia,serif}.status{font-size:.85rem;color:var(--muted)}
.wave{height:106px;margin:20px 0 14px;display:flex;align-items:center;gap:3px;cursor:pointer;position:relative}.bar{flex:1;min-width:2px;background:#39465a;border-radius:999px;transition:.12s opacity,.12s transform}.bar.played{background:linear-gradient(180deg,var(--accent2),var(--accent))}.wave:hover .bar{opacity:.9}.timeRow{display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.84rem}
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin-top:18px}.transport{display:flex;align-items:center;gap:10px;justify-content:center}.circle,.mini{border:1px solid #2d3a4d;background:#111824;color:var(--text);cursor:pointer;border-radius:999px}.circle{width:58px;height:58px;font-size:1.35rem}.mini{width:40px;height:40px}.circle:hover,.mini:hover{border-color:var(--accent);transform:translateY(-1px)}.toggles{display:flex;gap:8px}.toggles button.active{color:#0a0d12;background:var(--accent);border-color:var(--accent)}.volume{display:flex;justify-content:flex-end;gap:9px;align-items:center}.volume input{width:min(180px,28vw)}
.library{margin:20px 0 110px;background:#0b0f16d9;border:1px solid #1d2634;border-radius:24px;overflow:hidden}.libraryHead{padding:18px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #1d2634;position:sticky;top:0;background:#0b0f16f4;backdrop-filter:blur(18px);z-index:4}.libraryHead h2{margin:0;font:500 1.45rem Georgia,serif}.search{width:min(360px,54vw);background:#101722;border:1px solid #29364a;color:var(--text);padding:10px 13px;border-radius:999px;outline:none}.search:focus{border-color:var(--accent2)}
.track{display:grid;grid-template-columns:50px 1fr auto;gap:14px;align-items:center;padding:14px 20px;border-bottom:1px solid #171f2c;cursor:pointer}.track:last-child{border-bottom:0}.track:hover{background:#111824}.track.active{background:linear-gradient(90deg,#172238,#101722)}.num{font-variant-numeric:tabular-nums;color:#6f7a8a}.track.active .num{color:var(--accent)}.name{font-weight:650}.sub{color:var(--muted);font-size:.83rem;margin-top:2px}.playGlyph{color:var(--accent);font-size:.9rem}.empty{padding:34px 20px;color:var(--muted);text-align:center}
.footer{color:#6f7886;text-align:center;padding:10px 0 36px;font-size:.82rem}
@media(max-width:760px){.shell{width:min(100% - 16px,1180px)}.hero{min-height:420px}.portrait{width:58vw;opacity:.7}.heroCopy{left:22px;right:22px;bottom:28px}.controls{grid-template-columns:1fr}.toggles,.volume{justify-content:center}.volume input{width:150px}.track{grid-template-columns:38px 1fr auto;padding:13px 14px}.libraryHead{padding:14px;align-items:flex-start;flex-direction:column}.search{width:100%}}
</style>
</head>
<body>
<div class="shell">
<header class="hero">
  <img class="portrait" src="assets/Bryan as Kevin Kostner.png" alt="Bryan MacKayne" />
  <div class="heroCopy">
    <div class="eyebrow">Bryan MacKayne</div>
    <h1>Dies Iovis <span>Album XI</span></h1>
    <p>Twenty-five pieces from the Dies Iovis cycle. Press play and let the machine room breathe.</p>
  </div>
</header>

<main class="player">
<section class="now">
  <div class="meta"><div class="titleWrap"><small>Now playing</small><div id="trackTitle" class="trackTitle">Dies Iovis [ I ] - Core</div></div><div id="status" class="status">ready</div></div>
  <div id="wave" class="wave" aria-label="Seek through track"></div>
  <div class="timeRow"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
  <div class="controls">
    <div class="toggles"><button id="shuffle" class="mini" title="Shuffle">⤨</button><button id="repeat" class="mini" title="Repeat">↻</button></div>
    <div class="transport"><button id="prev" class="mini" title="Previous">⏮</button><button id="play" class="circle" title="Play/Pause">▶</button><button id="next" class="mini" title="Next">⏭</button></div>
    <div class="volume"><span>🔊</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.86" aria-label="Volume" /></div>
  </div>
</section>

<section class="library">
  <div class="libraryHead"><h2>Dies Iovis · 25 tracks</h2><input id="search" class="search" type="search" placeholder="Search the album…" /></div>
  <div id="trackList"></div>
</section>
</main>
<div class="footer">Bryan MacKayne – Dies Iovis · GitHub Pages player</div>
</div>
<audio id="audio" preload="metadata"></audio>
<script>
const RELEASE_TAG='dies-iovis';
const RELEASE_BASE=`https://github.com/bryanzzai/bryanmackayne/releases/download/${RELEASE_TAG}`;
const tracks=[
['I','Core'],['II','Jazz'],['III','Jazz'],['IV','Slow'],['V','Slow'],['VI','Tema'],['VII','Boom'],['VIII','Boom'],['IX','Tema'],['X','Tema'],['XI','Tema'],['XII','Sand'],['XIII','Anon'],['XIV','Song'],['XV','Song'],['XVI','Rain'],['XVII','Rain'],['XVIII','Snow'],['XIX','Bird'],['XX','Bull'],['XXI','Bull'],['XXII','Frog'],['XXIII','Frog'],['XXIV','Boom'],['XXV','Wind']
].map(([roman,label],i)=>({roman,label,index:i,title:`Dies Iovis [ ${roman} ] - ${label}`,file:`Dies.Iovis.${roman}.-.${label}.web.m4a`}));
const $=s=>document.querySelector(s), audio=$('#audio'), play=$('#play'), wave=$('#wave'), list=$('#trackList');
let current=0, shuffle=false, repeat=false, waveBars=[];
function fmt(sec){if(!isFinite(sec))return'0:00';sec=Math.max(0,Math.floor(sec));return`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function assetUrl(file){return `${RELEASE_BASE}/${encodeURIComponent(file)}`}
function seededBars(seed,n=92){let h=2166136261;for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}const vals=[];for(let i=0;i<n;i++){h^=h<<13;h^=h>>>17;h^=h<<5;vals.push(18+(Math.abs(h)%82))}return vals}
function buildWave(seed){wave.innerHTML='';waveBars=seededBars(seed).map(v=>{const b=document.createElement('span');b.className='bar';b.style.height=`${v}%`;wave.appendChild(b);return b})}
function paintWave(){const p=audio.duration?audio.currentTime/audio.duration:0;const cut=Math.floor(p*waveBars.length);waveBars.forEach((b,i)=>b.classList.toggle('played',i<=cut))}
function renderList(filter=''){const q=filter.trim().toLowerCase();const visible=tracks.filter(t=>t.title.toLowerCase().includes(q));list.innerHTML=visible.length?'':'<div class="empty">No matching tracks.</div>';visible.forEach(t=>{const row=document.createElement('div');row.className='track'+(t.index===current?' active':'');row.innerHTML=`<div class="num">${String(t.index+1).padStart(2,'0')}</div><div><div class="name">${t.title}</div><div class="sub">Bryan MacKayne · Dies Iovis</div></div><div class="playGlyph">${t.index===current&&!audio.paused?'❚❚':'▶'}</div>`;row.onclick=()=>loadTrack(t.index,true);list.appendChild(row)})}
function loadTrack(i,autoplay=false){current=(i+tracks.length)%tracks.length;const t=tracks[current];audio.src=assetUrl(t.file);$('#trackTitle').textContent=t.title;$('#status').textContent='loading';buildWave(t.title);paintWave();renderList($('#search').value);if(autoplay)audio.play().catch(()=>{});}
function nextTrack(){if(shuffle){let n=current;while(n===current&&tracks.length>1)n=Math.floor(Math.random()*tracks.length);loadTrack(n,true)}else loadTrack(current+1,true)}
function prevTrack(){if(audio.currentTime>4){audio.currentTime=0}else loadTrack(current-1,true)}
play.onclick=()=>audio.paused?audio.play().catch(()=>{}):audio.pause();$('#next').onclick=nextTrack;$('#prev').onclick=prevTrack;
$('#shuffle').onclick=()=>{shuffle=!shuffle;$('#shuffle').classList.toggle('active',shuffle)};$('#repeat').onclick=()=>{repeat=!repeat;$('#repeat').classList.toggle('active',repeat)};
$('#volume').oninput=e=>audio.volume=e.target.value;audio.volume=.86;$('#search').oninput=e=>renderList(e.target.value);
wave.onclick=e=>{if(!audio.duration)return;const r=wave.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration};
audio.onplay=()=>{play.textContent='❚❚';$('#status').textContent='playing';renderList($('#search').value)};audio.onpause=()=>{play.textContent='▶';$('#status').textContent=audio.currentTime?'paused':'ready';renderList($('#search').value)};
audio.onloadedmetadata=()=>{$('#duration').textContent=fmt(audio.duration);$('#status').textContent=audio.paused?'ready':'playing'};
audio.ontimeupdate=()=>{$('#elapsed').textContent=fmt(audio.currentTime);paintWave()};audio.onended=()=>repeat?(audio.currentTime=0,audio.play()):nextTrack();
audio.onerror=()=>{$('#status').textContent='audio unavailable'};
document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.code==='Space'){e.preventDefault();play.click()}if(e.code==='ArrowRight')nextTrack();if(e.code==='ArrowLeft')prevTrack()});
loadTrack(0,false);
</script>
</body>
</html>
