name: Build offline snapshot

on:
  push:
    paths:
      - '.github/workflows/build-offline-snapshot.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout frozen source snapshot
        uses: actions/checkout@v4
        with:
          ref: 8bf59e3062f16ad8795eb9ccabed3c5b4c083daa
          path: snapshot

      - name: Download browser-ready audio and make players offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd snapshot

          mkdir -p dies-iovis/audio dies-solis/audio dies-martis/audio

          gh release download dies-iovis \
            --repo "$GITHUB_REPOSITORY" \
            --dir dies-iovis/audio \
            --pattern '*.web.m4a'

          gh release download dies-solis \
            --repo "$GITHUB_REPOSITORY" \
            --dir dies-solis/audio \
            --pattern '*.web.m4a'

          gh release download dies-martis \
            --repo "$GITHUB_REPOSITORY" \
            --dir dies-martis/audio \
            --pattern '*.web.m4a'

          python3 - <<'PY'
          from pathlib import Path
          import re

          for album in ('dies-iovis', 'dies-solis', 'dies-martis'):
              p = Path(album) / 'index.html'
              text = p.read_text(encoding='utf-8')
              text, n = re.subn(
                  r"const RELEASE_BASE=`https://github\.com/bryanzzai/bryanmackayne/releases/download/\$\{RELEASE_TAG\}`;",
                  "const RELEASE_BASE='audio';",
                  text,
                  count=1,
              )
              if n != 1:
                  raise SystemExit(f'Could not rewrite RELEASE_BASE in {p}')
              p.write_text(text, encoding='utf-8')
          PY

          cat > OFFLINE-SNAPSHOT.txt <<'EOF'
          BRYAN MACKAYNE — OFFLINE SNAPSHOT
          =================================

          Source repository: bryanzzai/bryanmackayne
          Source commit: 8bf59e3062f16ad8795eb9ccabed3c5b4c083daa
          Snapshot date: 2026-09-06

          This package contains the repository files plus the browser-ready
          .web.m4a audio from the dies-iovis, dies-solis and dies-martis releases.
          The three album players have been changed ONLY inside this offline copy
          so that they load audio from their local audio/ folders.

          To use:
          1. Unzip the package.
          2. Open index.html in a modern browser.
          3. No GitHub connection or internet connection is required for playback.
          EOF

          printf '\nOffline audio counts:\n' >> OFFLINE-SNAPSHOT.txt
          printf 'Dies Iovis: %s files\n' "$(find dies-iovis/audio -maxdepth 1 -type f -name '*.web.m4a' | wc -l)" >> OFFLINE-SNAPSHOT.txt
          printf 'Dies Solis: %s files\n' "$(find dies-solis/audio -maxdepth 1 -type f -name '*.web.m4a' | wc -l)" >> OFFLINE-SNAPSHOT.txt
          printf 'Dies Martis: %s files\n' "$(find dies-martis/audio -maxdepth 1 -type f -name '*.web.m4a' | wc -l)" >> OFFLINE-SNAPSHOT.txt

      - name: Verify expected audio counts
        run: |
          set -euo pipefail
          test "$(find snapshot/dies-iovis/audio -maxdepth 1 -type f -name '*.web.m4a' | wc -l)" -eq 25
          test "$(find snapshot/dies-solis/audio -maxdepth 1 -type f -name '*.web.m4a' | wc -l)" -eq 24
          test "$(find snapshot/dies-martis/audio -maxdepth 1 -type f -name '*.web.m4a' | wc -l)" -eq 20

      - name: Create portable ZIP
        run: |
          set -euo pipefail
          mv snapshot Bryan-MacKayne-OFFLINE
          zip -r -0 Bryan-MacKayne-OFFLINE-2026-09-06.zip Bryan-MacKayne-OFFLINE

      - name: Upload offline package
        uses: actions/upload-artifact@v4
        with:
          name: Bryan-MacKayne-OFFLINE-2026-09-06
          path: Bryan-MacKayne-OFFLINE-2026-09-06.zip
          compression-level: 0
          retention-days: 7
