name: Build offline takeout

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-offline-takeout.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OFFLINE_DIR: The-12-Day-Dancer-Offline
      MAX_PART_MIB: '450'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare offline working tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OFFLINE_DIR" takeout-parts
          mkdir -p "$OFFLINE_DIR"
          rsync -a --exclude='.git' --exclude="$OFFLINE_DIR" --exclude='takeout-parts' ./ "$OFFLINE_DIR/"
          printf '%s\n' "${GITHUB_SHA}" > "$OFFLINE_DIR/SOURCE-COMMIT.txt"

      - name: Download only browser media from Releases
        shell: bash
        run: |
          set -euo pipefail
          albums=(
            dies-iovis dies-solis dies-martis dies-albini dies-tigris dies-delfini
            dies-canis dies-felis dies-tauri dies-ursi dies-apri dies-akita
          )
          for album in "${albums[@]}"; do
            test -f "$OFFLINE_DIR/$album/index.html" || { echo "Missing album HTML: $album/index.html" >&2; exit 1; }
            if ! gh release view "$album" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Missing Release/tag: $album" >&2
              exit 1
            fi
            mkdir -p "$OFFLINE_DIR/$album/media"
            echo "Downloading offline media for $album"
            gh release download "$album" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$OFFLINE_DIR/$album/media" \
              --pattern '*.web.m4a' \
              --pattern '*.mp4' \
              --clobber
            count=$(find "$OFFLINE_DIR/$album/media" -maxdepth 1 -type f | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "No browser media downloaded for $album" >&2
              exit 1
            fi
            echo "$album: $count browser media files"
          done
          if find "$OFFLINE_DIR" -type f -name '*.m4a' ! -name '*.web.m4a' | grep -q .; then
            echo 'Original/non-web M4A unexpectedly present in offline tree.' >&2
            find "$OFFLINE_DIR" -type f -name '*.m4a' ! -name '*.web.m4a' -print >&2
            exit 1
          fi

      - name: Rewrite paths for strict offline use
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('The-12-Day-Dancer-Offline')
          albums = [
              'dies-iovis','dies-solis','dies-martis','dies-albini','dies-tigris','dies-delfini',
              'dies-canis','dies-felis','dies-tauri','dies-ursi','dies-apri','dies-akita'
          ]

          root_html = root / 'index.html'
          text = root_html.read_text(encoding='utf-8')
          for album in albums:
              text = text.replace(f'href="{album}/"', f'href="{album}/index.html"')
          root_html.write_text(text, encoding='utf-8', newline='\n')

          for album in albums:
              p = root / album / 'index.html'
              text = p.read_text(encoding='utf-8')
              text, n = re.subn(
                  r"const\s+RELEASE_BASE\s*=\s*(?:`[^`]*`|'[^']*'|\"[^\"]*\")\s*;",
                  "const RELEASE_BASE='media';",
                  text,
                  count=1,
              )
              if n != 1:
                  raise SystemExit(f'Could not rewrite RELEASE_BASE exactly once in {p}')
              text = text.replace('href="../"', 'href="../index.html"')
              p.write_text(text, encoding='utf-8', newline='\n')

      - name: Install offline range server and launchers
        shell: bash
        run: |
          cat > "$OFFLINE_DIR/server.py" <<'PY'
          from __future__ import annotations
          import os
          import re
          import shutil
          import threading
          import webbrowser
          from email.utils import formatdate
          from http import HTTPStatus
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path

          ROOT = Path(__file__).resolve().parent
          HOST = '127.0.0.1'
          PORT = 8765

          class RangeRequestHandler(SimpleHTTPRequestHandler):
              protocol_version = 'HTTP/1.1'

              def send_head(self):
                  path = self.translate_path(self.path)
                  if os.path.isdir(path):
                      parts = self.path.split('?', 1)[0].split('#', 1)[0]
                      if not parts.endswith('/'):
                          self.send_response(HTTPStatus.MOVED_PERMANENTLY)
                          self.send_header('Location', parts + '/')
                          self.end_headers()
                          return None
                      for index in ('index.html', 'index.htm'):
                          candidate = os.path.join(path, index)
                          if os.path.isfile(candidate):
                              path = candidate
                              break
                      else:
                          return self.list_directory(path)
                  ctype = self.guess_type(path)
                  try:
                      f = open(path, 'rb')
                  except OSError:
                      self.send_error(HTTPStatus.NOT_FOUND, 'File not found')
                      return None
                  try:
                      fs = os.fstat(f.fileno())
                      size = fs.st_size
                      start, end = 0, size - 1
                      status = HTTPStatus.OK
                      range_header = self.headers.get('Range')
                      if range_header:
                          m = re.fullmatch(r'bytes=(\d*)-(\d*)', range_header.strip())
                          if not m:
                              self.send_error(HTTPStatus.REQUESTED_RANGE_NOT_SATISFIABLE)
                              f.close()
                              return None
                          a, b = m.groups()
                          if a == '' and b == '':
                              self.send_error(HTTPStatus.REQUESTED_RANGE_NOT_SATISFIABLE)
                              f.close()
                              return None
                          if a == '':
                              length = int(b)
                              start = max(0, size - length)
                          else:
                              start = int(a)
                          if b != '':
                              end = min(size - 1, int(b))
                          if start >= size or start > end:
                              self.send_response(HTTPStatus.REQUESTED_RANGE_NOT_SATISFIABLE)
                              self.send_header('Content-Range', f'bytes */{size}')
                              self.end_headers()
                              f.close()
                              return None
                          status = HTTPStatus.PARTIAL_CONTENT
                      self.send_response(status)
                      self.send_header('Content-type', ctype)
                      self.send_header('Accept-Ranges', 'bytes')
                      self.send_header('Content-Length', str(end - start + 1))
                      self.send_header('Last-Modified', formatdate(fs.st_mtime, usegmt=True))
                      if status == HTTPStatus.PARTIAL_CONTENT:
                          self.send_header('Content-Range', f'bytes {start}-{end}/{size}')
                      self.end_headers()
                      self._range = (start, end)
                      f.seek(start)
                      return f
                  except Exception:
                      f.close()
                      raise

              def copyfile(self, source, outputfile):
                  start, end = getattr(self, '_range', (0, None))
                  if end is None:
                      return shutil.copyfileobj(source, outputfile)
                  remaining = end - start + 1
                  while remaining > 0:
                      chunk = source.read(min(1024 * 1024, remaining))
                      if not chunk:
                          break
                      outputfile.write(chunk)
                      remaining -= len(chunk)

              def log_message(self, fmt, *args):
                  print('[offline]', fmt % args)

          def open_browser():
              webbrowser.open(f'http://{HOST}:{PORT}/index.html')

          if __name__ == '__main__':
              os.chdir(ROOT)
              server = ThreadingHTTPServer((HOST, PORT), RangeRequestHandler)
              threading.Timer(0.8, open_browser).start()
              print(f'The 12 Day Dancer is running at http://{HOST}:{PORT}/index.html')
              print('Press Ctrl+C to stop.')
              try:
                  server.serve_forever()
              except KeyboardInterrupt:
                  pass
              finally:
                  server.server_close()
          PY

          cat > "$OFFLINE_DIR/START-THE-12-DAY-DANCER.cmd" <<'CMD'
          @echo off
          setlocal
          cd /d "%~dp0"
          where py >nul 2>&1
          if %errorlevel%==0 (
            py -3 server.py
            goto :eof
          )
          where python >nul 2>&1
          if %errorlevel%==0 (
            python server.py
            goto :eof
          )
          echo.
          echo Python 3 was not found.
          echo Install Python 3, then run this file again.
          echo.
          pause
          CMD

          cat > "$OFFLINE_DIR/TAKEOUT-README.txt" <<'TXT'
          THE 12 DAY DANCER - COMPLETE OFFLINE TAKEOUT

          This archive is designed to run without GitHub, Suno, or an internet connection.

          Windows start:
            Double-click START-THE-12-DAY-DANCER.cmd

          Then the local player opens at:
            http://127.0.0.1:8765/index.html

          Important offline changes:
          - Every Bulgarian-panel album button points explicitly to <album>/index.html.
          - Every album uses local media in <album>/media/.
          - Only browser-ready *.web.m4a audio is included; original M4A masters are intentionally excluded.
          - Dies Akita includes the nine MP4 films used by the video player.
          - The included local Python server supports HTTP byte ranges so seeking works for audio and video.

          If this takeout arrived as several Part-XXX.zip files:
            Extract EVERY part into the same destination folder.
            Allow folders to merge. The parts are independent ZIPs containing disjoint files.

          Verification files:
            SOURCE-COMMIT.txt
            MANIFEST-SHA256.txt
            OFFLINE-TEST-REPORT.txt
          TXT

      - name: Validate media mappings and generate manifest
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import re

          root = Path('The-12-Day-Dancer-Offline')
          albums = [
              'dies-iovis','dies-solis','dies-martis','dies-albini','dies-tigris','dies-delfini',
              'dies-canis','dies-felis','dies-tauri','dies-ursi','dies-apri','dies-akita'
          ]
          report = []

          root_text = (root/'index.html').read_text(encoding='utf-8')
          for album in albums:
              expected = f'href="{album}/index.html"'
              if expected not in root_text:
                  raise SystemExit(f'Missing explicit offline panel link: {expected}')
          report.append('Bulgarian panel: 12/12 explicit index.html links OK')

          total_media = 0
          for album in albums:
              html = (root/album/'index.html').read_text(encoding='utf-8')
              if 'github.com/bryanzzai/bryanmackayne/releases/download' in html:
                  raise SystemExit(f'Online Release URL still present in {album}/index.html')
              if "const RELEASE_BASE='media';" not in html:
                  raise SystemExit(f'Local RELEASE_BASE missing in {album}/index.html')
              refs = []
              for m in re.findall(r"['\"]([^'\"]+\.(?:web\.m4a|mp4))['\"]", html):
                  if m not in refs:
                      refs.append(m)
              if not refs:
                  raise SystemExit(f'No media references found in {album}/index.html')
              missing = [name for name in refs if not (root/album/'media'/name).is_file()]
              extra = sorted(p.name for p in (root/album/'media').iterdir() if p.is_file() and p.name not in refs)
              if missing or extra:
                  raise SystemExit(f'{album}: mapping mismatch; missing={missing}; extra={extra}')
              total_media += len(refs)
              report.append(f'{album}: {len(refs)} media references = {len(refs)} local files')

          originals = [p for p in root.rglob('*.m4a') if not p.name.endswith('.web.m4a')]
          if originals:
              raise SystemExit('Original M4A files found: ' + ', '.join(map(str, originals[:20])))
          report.append('Original M4A masters: 0 included (intentional)')
          report.append(f'Total local browser media: {total_media}')

          manifest_lines = []
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name != 'MANIFEST-SHA256.txt'):
              h = hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024*1024), b''):
                      h.update(chunk)
              manifest_lines.append(f'{h.hexdigest()}  {p.relative_to(root).as_posix()}')
          (root/'MANIFEST-SHA256.txt').write_text('\n'.join(manifest_lines)+'\n', encoding='utf-8')
          (root/'OFFLINE-TEST-REPORT.txt').write_text('\n'.join(report)+'\n', encoding='utf-8')
          print('\n'.join(report))

      - name: Validate every media container with ffprobe
        shell: bash
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r -d '' f; do
            duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f")
            python - "$f" "$duration" <<'PY'
          import sys
          path, duration = sys.argv[1], float(sys.argv[2])
          if not duration > 0:
              raise SystemExit(f'Invalid media duration: {path}: {duration}')
          PY
            checked=$((checked+1))
          done < <(find "$OFFLINE_DIR" -type f \( -name '*.web.m4a' -o -name '*.mp4' \) -print0)
          echo "ffprobe OK: $checked media files"
          printf '\nffprobe: %s/%s media files have valid positive duration\n' "$checked" "$checked" >> "$OFFLINE_DIR/OFFLINE-TEST-REPORT.txt"

      - name: Start strict local server
        shell: bash
        run: |
          set -euo pipefail
          cd "$OFFLINE_DIR"
          python3 server.py > /tmp/offline-server.log 2>&1 &
          echo $! > /tmp/offline-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/offline-server.log >&2
          exit 1

      - name: Test HTTP range support on every media file
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import quote
          import urllib.request

          root = Path('The-12-Day-Dancer-Offline')
          media = sorted([*root.rglob('*.web.m4a'), *root.rglob('*.mp4')])
          for p in media:
              rel = p.relative_to(root).as_posix()
              req = urllib.request.Request('http://127.0.0.1:8765/' + quote(rel), headers={'Range':'bytes=0-31'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  if r.status != 206:
                      raise SystemExit(f'Range test failed for {rel}: HTTP {r.status}')
                  if len(r.read()) != 32:
                      raise SystemExit(f'Range length failed for {rel}')
          with (root/'OFFLINE-TEST-REPORT.txt').open('a', encoding='utf-8') as f:
              f.write(f'HTTP byte-range: {len(media)}/{len(media)} media files returned 206\n')
          print(f'HTTP byte-range OK: {len(media)} media files')

      - name: Browser smoke test all 12 buttons and all players
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet selenium
          python3 <<'PY'
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          albums = [
              'dies-iovis','dies-solis','dies-martis','dies-albini','dies-tigris','dies-delfini',
              'dies-canis','dies-felis','dies-tauri','dies-ursi','dies-apri','dies-akita'
          ]
          root = Path('The-12-Day-Dancer-Offline')
          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--mute-audio')
          opts.add_argument('--autoplay-policy=no-user-gesture-required')
          opts.add_argument('--allow-insecure-localhost')
          driver = webdriver.Chrome(options=opts)
          driver.set_page_load_timeout(60)
          base = 'http://127.0.0.1:8765/'
          try:
              driver.get(base + 'index.html')
              links = driver.execute_script("return [...document.querySelectorAll('a.album.live')].map(a=>a.getAttribute('href'))")
              if len(links) != 12:
                  raise RuntimeError(f'Bulgarian panel has {len(links)} live buttons, expected 12')
              expected = [f'{a}/index.html' for a in albums]
              if links != expected:
                  raise RuntimeError(f'Panel order/path mismatch: {links}')

              tested = []
              for album in albums:
                  driver.get(base + album + '/index.html')
                  if album == 'dies-akita':
                      ok = driver.execute_async_script("""
                        const done=arguments[0], v=document.querySelector('#player');
                        let t=0;
                        const finish=(x)=>{clearInterval(timer);done(x)};
                        v.muted=true;
                        v.play().catch(()=>{});
                        const timer=setInterval(()=>{
                          t++;
                          if(v.error) finish({ok:false,error:v.error.code,current:v.currentTime,ready:v.readyState});
                          else if(v.currentTime>0.2 && v.readyState>=2){
                            const target=Math.min(10,Math.max(1,(v.duration||2)/2));
                            v.currentTime=target;
                            setTimeout(()=>finish({ok:!v.error && v.currentTime>0,error:v.error&&v.error.code,current:v.currentTime,ready:v.readyState}),700);
                          }
                          else if(t>40) finish({ok:false,error:'timeout',current:v.currentTime,ready:v.readyState});
                        },250);
                      """)
                  else:
                      ok = driver.execute_async_script("""
                        const done=arguments[0], a=document.querySelector('audio');
                        let t=0;
                        a.muted=true;
                        a.play().catch(()=>{});
                        const timer=setInterval(()=>{
                          t++;
                          if(a.error){clearInterval(timer);done({ok:false,error:a.error.code,current:a.currentTime,ready:a.readyState});}
                          else if(a.currentTime>0.2 && a.readyState>=2){
                            const target=Math.min(10,Math.max(1,(a.duration||2)/2));
                            a.currentTime=target;
                            setTimeout(()=>{clearInterval(timer);done({ok:!a.error && a.currentTime>0,error:a.error&&a.error.code,current:a.currentTime,ready:a.readyState});},500);
                          }
                          else if(t>40){clearInterval(timer);done({ok:false,error:'timeout',current:a.currentTime,ready:a.readyState});}
                        },250);
                      """)
                  if not ok.get('ok'):
                      raise RuntimeError(f'{album} browser media test failed: {ok}')
                  tested.append(f"{album}: browser playback + seek OK (readyState={ok.get('ready')}, currentTime={ok.get('current')})")

              with (root/'OFFLINE-TEST-REPORT.txt').open('a', encoding='utf-8') as f:
                  f.write('Browser smoke test: 12/12 Bulgarian-panel links explicit and reachable\n')
                  f.write('\n'.join(tested) + '\n')
              print('\n'.join(tested))
          finally:
              driver.quit()
          PY

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/offline-server.pid ]; then
            kill "$(cat /tmp/offline-server.pid)" 2>/dev/null || true
          fi

      - name: Split complete takeout into independent ZIP parts
        shell: python
        run: |
          from pathlib import Path
          import zipfile

          root = Path('The-12-Day-Dancer-Offline')
          out = Path('takeout-parts')
          out.mkdir(exist_ok=True)
          max_bytes = int(450 * 1024 * 1024)
          files = sorted(p for p in root.rglob('*') if p.is_file())
          groups, current, current_size = [], [], 0
          for p in files:
              size = p.stat().st_size
              if current and current_size + size > max_bytes:
                  groups.append(current)
                  current, current_size = [], 0
              current.append(p)
              current_size += size
          if current:
              groups.append(current)

          summary = []
          for i, group in enumerate(groups, 1):
              zpath = out / f'The-12-Day-Dancer-Offline-Part-{i:03d}.zip'
              with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as z:
                  for p in group:
                      arc = Path(root.name) / p.relative_to(root)
                      z.write(p, arc.as_posix())
              summary.append(f'{zpath.name}\t{zpath.stat().st_size}\t{len(group)} files')
          (out/'PARTS.txt').write_text('\n'.join(summary)+'\n', encoding='utf-8')
          print('\n'.join(summary))

      - name: Upload complete offline takeout parts
        uses: actions/upload-artifact@v4
        with:
          name: The-12-Day-Dancer-Complete-Offline-Takeout
          path: takeout-parts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
