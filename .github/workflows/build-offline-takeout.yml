name: Build offline takeout

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-offline-takeout.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OFFLINE_DIR: The-12-Day-Dancer-Offline
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare offline working tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OFFLINE_DIR" takeout-parts
          mkdir -p "$OFFLINE_DIR"
          rsync -a --exclude='.git' --exclude="$OFFLINE_DIR" --exclude='takeout-parts' ./ "$OFFLINE_DIR/"
          printf '%s\n' "$GITHUB_SHA" > "$OFFLINE_DIR/SOURCE-COMMIT.txt"

      - name: Download browser media from all 12 Releases
        shell: bash
        run: |
          set -euo pipefail
          albums=(
            dies-iovis dies-solis dies-martis dies-albini dies-tigris dies-delfini
            dies-canis dies-felis dies-tauri dies-ursi dies-apri dies-akita
          )
          for album in "${albums[@]}"; do
            test -f "$OFFLINE_DIR/$album/index.html" || { echo "Missing $album/index.html" >&2; exit 1; }
            gh release view "$album" --repo "$GITHUB_REPOSITORY" >/dev/null
            mkdir -p "$OFFLINE_DIR/$album/media"
            echo "Downloading $album"
            gh release download "$album" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$OFFLINE_DIR/$album/media" \
              --pattern '*.web.m4a' \
              --pattern '*.mp4' \
              --clobber
            count=$(find "$OFFLINE_DIR/$album/media" -maxdepth 1 -type f | wc -l)
            echo "$album: $count browser media files"
          done
          if find "$OFFLINE_DIR" -type f -name '*.m4a' ! -name '*.web.m4a' | grep -q .; then
            echo 'Original/non-web M4A unexpectedly present.' >&2
            exit 1
          fi

      - name: Make strict offline edition
        run: python3 .github/offline/prepare_takeout.py

      - name: Install browser test dependency
        run: python3 -m pip install --quiet selenium

      - name: Test complete offline edition
        run: python3 .github/offline/test_takeout.py

      - name: Manifest and split package
        run: python3 .github/offline/package_takeout.py

      - name: Upload complete offline takeout
        uses: actions/upload-artifact@v4
        with:
          name: The-12-Day-Dancer-Complete-Offline-Takeout
          path: takeout-parts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
