name: Transcode web audio

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/transcode-web-audio.yml'

permissions:
  contents: write

jobs:
  transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download ALAC release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source web
          gh release download dies-iovis \
            --repo "$GITHUB_REPOSITORY" \
            --dir source \
            --pattern '*.m4a'

      - name: Transcode to browser-friendly AAC
        run: |
          shopt -s nullglob
          for f in source/*.m4a; do
            base="${f##*/}"
            [[ "$base" == *.web.m4a ]] && continue
            out="${base%.m4a}.web.m4a"
            echo "Transcoding $base -> $out"
            ffmpeg -hide_banner -loglevel error -y \
              -i "$f" \
              -vn -c:a aac -b:a 256k -movflags +faststart \
              "web/$out"
          done

      - name: Upload AAC assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload dies-iovis web/*.web.m4a \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
